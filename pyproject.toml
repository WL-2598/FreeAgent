[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freeagent"
version = "0.1.0"
description = "本地终端智能体：网页模型负责规划，本地受控工具负责受限执行"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FreeAgent contributors" }]
dependencies = [
    "pydantic>=2.6,<3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "mcp>=2,<3"]
# OpenClaw 等 MCP 客户端接入所需；核心 CLI 不依赖它。
mcp = ["mcp>=2,<3"]
# 网页连接器仅在网站条款确认允许后才可启用；此依赖不是 MVP 的必需项。
web = ["playwright>=1.40"]

[project.scripts]
freeagent = "freeagent.cli:main"
freeagent-mcp = "freeagent.mcp_server:main"

[tool.setuptools]
packages = ["freeagent", "freeagent.tools", "freeagent.connectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
